#btn{position:absolute;left:4.5em;right:4.6em;bottom:0;height:7.2em;border-radius:1em;background:#24272c;color:#fff;font-size:1em;display:grid;place-items:center}
#btn span{font-size:2.3em;font-weight:500}
#btn:active{background:#000}

/* ---------- me: live balance ---------- */
#chip{position:absolute;right:3.05em;top:15.5em;height:6.5em;min-width:9.2em;padding:0 2.4em 0 2.3em;border-radius:3.3em;background:#fff;
  display:flex;align-items:center;justify-content:center;gap:.8em;transform-origin:100% 50%;transition:box-shadow .3s}
#chip img{width:2.6em;height:2.6em;object-fit:contain}
#chip b{font-size:2.3em;font-weight:500;font-variant-numeric:tabular-nums}
#chip.hot2{box-shadow:0 0 0 .35em rgba(27,29,31,.12),0 .8em 2.4em rgba(0,0,0,.18)}
#chip.bump{animation:bump .22s ease-out}
@keyframes bump{40%{transform:scale(1.12)}}
.fly{position:absolute;width:3.4em;height:3.4em;pointer-events:none;z-index:50}
.fly img{width:100%;height:100%;object-fit:contain}

/* ---------- congratulations sheet (Roblox style) ---------- */
#ov{position:absolute;inset:0;z-index:60;background:rgba(0,0,0,0);pointer-events:none;transition:background .3s}
#ov.on{background:rgba(0,0,0,.5);pointer-events:auto}
#card{position:absolute;left:3.6em;right:3.6em;top:50%;background:#fff;border-radius:2.2em;padding:4em 3.6em 3.6em;text-align:center;
  transform:translateY(-40%) scale(.9);opacity:0;transition:transform .38s cubic-bezier(.2,1.3,.4,1),opacity .25s;box-shadow:0 2em 5em rgba(0,0,0,.25)}
#ov.on #card{transform:translateY(-50%) scale(1);opacity:1}
#card .ic{position:relative;width:13em;height:13em;margin:0 auto}
#card .ic img{position:relative;width:100%;height:100%;object-fit:contain;animation:float 2.4s ease-in-out infinite}
#card .ic::before{content:"";position:absolute;inset:-2.6em;border-radius:50%;background:repeating-conic-gradient(rgba(27,29,31,.07) 0 10deg,transparent 10deg 20deg);animation:spin 9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes float{50%{transform:translateY(-.6em)}}
#card h3{font-size:3em;font-weight:700;margin-top:1.1em;letter-spacing:-.01em}
#card p{font-size:2em;color:#6c7076;line-height:1.4;margin-top:.5em}
#card .amt{display:inline-flex;align-items:center;gap:.25em;margin-top:.5em;font-size:4.4em;font-weight:800;letter-spacing:-.02em}
#card .amt img{width:.82em;height:.82em;object-fit:contain}
#claim{display:grid;place-items:center;width:100%;height:7.2em;border-radius:1em;background:#24272c;color:#fff;margin-top:2.8em}
#claim span{font-size:2.3em;font-weight:500}
#claim:active{background:#000}
#conf{position:absolute;inset:0;z-index:61;pointer-events:none}
</style>
</head>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const scr = $('scr'), DW = 591, DH = 1280;
  const REWARD = 10000;

  /* ---------- fit: full screen on phones, centred scaled-up app on tablets / desktop ---------- */
  function fit(){
    const vv = window.visualViewport;
    const W = vv ? vv.width : innerWidth, H = vv ? vv.height : innerHeight;
    const s = Math.min(W / DW, H / DH);
    const w = Math.round(DW * s), h = Math.round(DH * s);
    scr.style.width = w + 'px'; scr.style.height = h + 'px';
    scr.style.fontSize = (w / 59.1) + 'px';
    document.body.classList.toggle('wide', W - w > 40);
    sizeConf();
  }
  addEventListener('resize', fit);
  window.visualViewport && visualViewport.addEventListener('resize', fit);
  addEventListener('orientationchange', () => setTimeout(fit, 200));

  let fsTried = false;
  addEventListener('pointerdown', () => {
    if (fsTried) return; fsTried = true;
    const d = document.documentElement, rq = d.requestFullscreen || d.webkitRequestFullscreen;
    if (rq && !document.fullscreenElement && matchMedia('(pointer:coarse)').matches){ try { rq.call(d, {navigationUI:'hide'}).catch(()=>{}); } catch(e){} }
  }, {passive:true});

  /* ---------- navigation ---------- */
  let cur = '';
  function go(name){
    if (name === cur) return;
    cur = name;
    document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === 's-' + name));
    if (name === 'me') onMe();
  }
  document.querySelectorAll('#nav .hot').forEach(h => h.addEventListener('click', () => go(h.dataset.go)));
  $('h-rbx').addEventListener('click', () => go('me'));

  /* ---------- puzzle ---------- */
  const board = $('board'), movesEl = $('moves');
  let order = [], sel = null, moves = 0, solved = false;
  const tiles = [];
  for (let i = 0; i < 9; i++){
    const t = document.createElement('div');
    t.className = 'tile';
    t.addEventListener('click', () => pick(i));
    board.appendChild(t); tiles.push(t);
  }
  function paint(){
    order.forEach((piece, slot) => {
      const x = piece % 3, y = Math.floor(piece / 3);
      tiles[slot].style.backgroundPosition = (x * 50) + '% ' + (y * 50) + '%';
    });
  }
  function reset(){
    order = [0,1,2,3,5,4,6,8,7];   // always the same: pieces 5<->6 and 8<->9 are swapped
    sel = null; moves = 0; solved = false;
    tiles.forEach(t => t.classList.remove('sel'));
    board.classList.remove('done');
    movesEl.textContent = 'Moves: 0';
    paint();
  }
  function pick(slot){
    if (solved) return;
    if (sel === null){ sel = slot; tiles[slot].classList.add('sel'); return; }
    if (sel === slot){ tiles[slot].classList.remove('sel'); sel = null; return; }
    const a = sel; sel = null;
    tiles[a].classList.remove('sel');
    [order[a], order[slot]] = [order[slot], order[a]];
    paint();
    [a, slot].forEach(s => { tiles[s].classList.remove('swap'); void tiles[s].offsetWidth; tiles[s].classList.add('swap'); });
    moves++; movesEl.textContent = 'Moves: ' + moves;
    if (order.every((p, i) => p === i)) win();
  }
  function win(){
    solved = true;
    board.classList.add('done');
    movesEl.textContent = 'Completed in ' + moves + ' moves';
    setTimeout(openCard, 900);
  }

  /* ---------- congratulations ---------- */
  const ov = $('ov');
  $('amt').textContent = REWARD.toLocaleString('en-US');
  function openCard(){ ov.classList.add('on'); confetti(); }
  let pending = 0, balance = 0;
  $('claim').addEventListener('click', () => {
    ov.classList.remove('on');
    pending += REWARD;
    $('medot').classList.add('on');
  });

  /* ---------- tap on the balance: everything goes back ---------- */
  $('chip').style.cursor = 'pointer';
  $('chip').addEventListener('click', () => {
    pending = 0; balance = 0; bal.textContent = '0';
    ov.classList.remove('on'); $('medot').classList.remove('on');
    reset(); cur = ''; go('home');
  });

  /* ---------- me: balance appears ---------- */
  const chip = $('chip'), bal = $('bal');
  const fmt = n => Math.round(n).toLocaleString('en-US');
  function onMe(){
    $('medot').classList.remove('on');
    if (!pending) { bal.textContent = fmt(balance); return; }
    const from = balance, to = balance + pending; pending = 0; balance = to;
    bal.textContent = fmt(from);
    setTimeout(() => countUp(from, to), 300);
  }
  function countUp(from, to){
    const t0 = performance.now(), D = 1400;
    chip.classList.add('hot2');
    let lastBump = 0;
    const step = now => {
      const p = Math.min(1, (now - t0) / D), e = 1 - Math.pow(1 - p, 3);
      bal.textContent = fmt(from + (to - from) * e);
      if (now - lastBump > 140 && p < 1){ lastBump = now; chip.classList.remove('bump'); void chip.offsetWidth; chip.classList.add('bump'); }
      if (p < 1) requestAnimationFrame(step); else setTimeout(() => chip.classList.remove('hot2'), 600);
    };
    requestAnimationFrame(step);
  }
  /* ---------- confetti (red / white / green, Christmas) ---------- */
  const cv = $('conf'), cx = cv.getContext('2d');
  let parts = [], craf = 0;
  function sizeConf(){ const r = scr.getBoundingClientRect(), d = Math.min(2, devicePixelRatio || 1); cv.width = r.width * d; cv.height = r.height * d; cv.style.width = r.width + 'px'; cv.style.height = r.height + 'px'; cx.setTransform(d,0,0,d,0,0); }
  function confetti(){
    const r = scr.getBoundingClientRect(), cols = ['#e8352e','#ffffff','#1f9d55','#ffd23f','#1b1d1f'];
    for (let i = 0; i < 140; i++) parts.push({ x: r.width / 2, y: r.height * .42, vx: (Math.random() - .5) * r.width * .045, vy: -Math.random() * r.height * .022 - 4,
      s: 4 + Math.random() * 6, c: cols[i % cols.length], a: Math.random() * 6, va: (Math.random() - .5) * .4, life: 0 });
    if (!craf) craf = requestAnimationFrame(tick);
  }
  function tick(){
    const r = scr.getBoundingClientRect();
    cx.clearRect(0, 0, r.width, r.height);
    parts = parts.filter(p => p.y < r.height + 20 && p.life < 400);
    for (const p of parts){
      p.vy += .32; p.vx *= .985; p.x += p.vx; p.y += p.vy; p.a += p.va; p.life++;
      cx.save(); cx.translate(p.x, p.y); cx.rotate(p.a); cx.fillStyle = p.c;
      cx.strokeStyle = 'rgba(0,0,0,.12)'; cx.lineWidth = .6;
      cx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); cx.strokeRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); cx.restore();
    }
    craf = parts.length ? requestAnimationFrame(tick) : 0;
  }

  fit(); reset(); go('home');
  window.__solve = () => { order = [0,1,2,3,4,5,6,7,8]; paint(); win(); };
})();
</script>
